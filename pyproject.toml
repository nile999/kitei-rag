[project]
name = "kitei-rag"
version = "0.1.0"
description = "架空のSES企業の社内規約に、根拠の条文を示して答えるRAGシステム（ポートフォリオ）"
readme = "README.md"
authors = [
    { name = "Nile", email = "54053114+nile999@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.163.1",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
]

[tool.uv]
# app/ は配布用のパッケージにせず、リポジトリ直下から `uv run` で動かす。
# そのためビルド設定（build-system）は置かない。
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]